# ─────────────────────────────────────────────────────────────────────────────
# GFPMS — GitHub Actions CI/CD Pipeline
# DevOps / Sprint 1: Foundation & Access Management
#
# Triggers on every push/PR to 'main'. Runs:
#   1. Backend: Black format check → Flake8 lint → Pytest with coverage
#   2. Frontend: npm install → ESLint → Next.js build check
# ─────────────────────────────────────────────────────────────────────────────

name: GFPMS CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend: Quality + Tests ─────────────────────────────────────────────────
  backend-ci:
    name: Backend — Lint, Format & Test
    runs-on: ubuntu-latest

    services:
      # Spin up a real PostgreSQL instance for integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest-cov httpx

      - name: Check Code Formatting (Black)
        working-directory: ./backend
        run: black app/ --check --diff

      - name: Lint Code (Flake8)
        working-directory: ./backend
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Alembic Migrations (Test DB)
        working-directory: ./backend
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_SERVER: localhost
          POSTGRES_DB: ci_test_db
          SECRET_KEY: ci_secret_key_sprint1_testing_only
          ALGORITHM: HS256
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
        run: alembic upgrade head

      - name: Run Pytest with Coverage
        working-directory: ./backend
        env:
          PYTHONPATH: .
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_SERVER: localhost
          POSTGRES_DB: ci_test_db
          SECRET_KEY: ci_secret_key_sprint1_testing_only
          ALGORITHM: HS256
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=60

  # ── Frontend: Lint + Build ───────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Integration Smoke Test ───────────────────────────────────────────────────
  integration-smoke:
    name: Integration — API Smoke Tests
    runs-on: ubuntu-latest
    needs: [backend-ci]   # only run after backend passes

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Alembic Migrations
        working-directory: ./backend
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_SERVER: localhost
          POSTGRES_DB: ci_test_db
          SECRET_KEY: ci_secret_key_sprint1_testing_only
          ALGORITHM: HS256
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
        run: alembic upgrade head

      - name: Run Integration Smoke Tests
        working-directory: ./backend
        env:
          PYTHONPATH: .
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_SERVER: localhost
          POSTGRES_DB: ci_test_db
          SECRET_KEY: ci_secret_key_sprint1_testing_only
          ALGORITHM: HS256
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
        run: pytest tests/ -v -k "smoke"
